[project]
name = "trend-following-replication"
version = "0.1.0"
description = "Replication and out-of-sample test of 'Two centuries of trend following' (Lempérière et al., 2014) on free data."
readme = "README.md"
license = "MIT"
authors = [{ name = "Liangxi Wang" }]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.10",
    "numpy>=2.2",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "scipy>=1.14",
    "seaborn>=0.13",
    "typst>=0.14",
    "xlrd>=2.0",
]

[project.scripts]
trendrep = "trendrep.study:main"
trendrep-report = "trendrep.report:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trendrep"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["src/trendrep/viz_style.py"]  # vendored personal style file

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY"]
ignore = ["B905"]  # zip(axes, "abc") pairs panels with letters; lengths differ on purpose

[tool.ruff.lint.per-file-ignores]
"src/trendrep/plots.py" = ["F403", "F405", "E402"]  # names come from the vendored style module
